collections_config:
  pages:
    path: ''
    name: pages
    label: Pages
    icon: wysiwyg
    filter:
      include:
        - index.html
    _enabled_editors:
      - visual
      - content

  gallery:
    path: photos/Bentley_files
    name: gallery
    label: Gallery Photos
    icon: image
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/photo.md
    _inputs:
      title:
        type: text
        label: Photo Title
      category:
        type: select
        label: Category
        options:
          values:
            - Exterior
            - Interior
      image:
        type: image
        label: Photo
        uploads_dir: photos/Bentley_files

uploads_dir: photos/Bentley_files
